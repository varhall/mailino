name: "Tests"

on:
  pull_request:
    paths-ignore:
      - ".docs/**"
  push:
    branches:
      - "*"
  schedule:
    - cron: "0 8 * * 1" # At 08:00 on Monday

env:
  extensions: "json, curl, fileinfo"

jobs:
  tests:
    name: "Tests"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        php: [ "8.5", "8.4", "8.3", "8.2" ]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: "${{ env.extensions }}"
      - run: composer install --no-progress --prefer-dist
      - run: make tests
        shell: bash
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: tests/**/output


  tests-lowest:
    name: "Tests (lowest dependencies)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: "${{ env.extensions }}"
      - run: composer update --no-progress --prefer-dist --prefer-lowest --prefer-stable
      - run: make tests
        shell: bash

  cs:
    name: "Coding standard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: "${{ env.extensions }}"
      - run: composer install --no-progress --prefer-dist
      - run: make cs
        shell: bash

  phpstan:
    name: "PHPStan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: "${{ env.extensions }}"
      - run: composer install --no-progress --prefer-dist
      - run: make phpstan
        shell: bash

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: "${{ env.extensions }}"
          coverage: pcov
      - run: composer install --no-progress --prefer-dist
      - run: make coverage
        shell: bash
      - run: wget https://github.com/php-coveralls/php-coveralls/releases/download/v2.4.3/php-coveralls.phar
      - env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php php-coveralls.phar --verbose --config tests/.coveralls.yml